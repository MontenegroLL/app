# Configuração do gitleaks — scanner de segredos do Núcleo PDV.
# Documentação: https://github.com/gitleaks/gitleaks

title = "Núcleo PDV secret scanning"

[extend]
# Estende as regras padrão do gitleaks (centenas de detecções de credenciais).
useDefault = true

[allowlist]
description = "Falsos positivos conhecidos e arquivos que não devem ser escaneados"
paths = [
  # Dependências e artefatos de build
  '''node_modules''',
  '''apps/backend/.medusa''',
  '''apps/storefront/.next''',
  '''**/dist/''',
  '''**/build/''',
  '''**/coverage/''',
  '''**/*.tsbuildinfo''',
  # Skills vendored (código de terceiros)
  '''.agents/''',
  # Templates de env (contêm apenas placeholders vazios)
  '''**/.env.template''',
]
# Placeholders explícitos que não são segredos reais.
regexes = [
  '''(?i)supersecret''',
  '''(?i)changeme''',
  '''(?i)your[-_]?secret''',
  '''(?i)placeholder''',
]
