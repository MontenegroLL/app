name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  biome:
    name: Lint & Format (Biome)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Biome (binário standalone)
        run: |
          curl -fsSL https://biomejs.dev/install.sh | sh
          echo "$HOME/.biome/bin" >> "$GITHUB_PATH"

      - name: Rodar Biome check
        # Reporta o estado do lint/format sem bloquear o pipeline enquanto o
        # débito de lint legado do starter Medusa é reduzido gradualmente.
        run: biome check .
        continue-on-error: true

      - name: Resumo do Biome
        run: echo "Relatório de lint/format gerado acima. Débito legado é reduzido de forma incremental."
